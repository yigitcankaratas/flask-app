{% extends "base.html" %}

{% block title %}500 - Sunucu Hatası{% endblock %}

{% block content %}
<div class="text-center">
    <div class="error-page">
        <h1 class="display-1 text-danger">500</h1>
        <h2>Sunucu Hatası</h2>
        <p class="lead">Üzgünüz, bir sunucu hatası oluştu. Lütfen daha sonra tekrar deneyiniz.</p>
        
        <div class="mt-4">
            <a href="{{ url_for('home') }}" class="btn btn-primary">
                <i class="fas fa-home"></i> Ana Sayfaya Dön
            </a>
            <a href="{{ url_for('contact') }}" class="btn btn-outline-secondary">
                <i class="fas fa-bug"></i> Hatayı Bildir
            </a>
        </div>
        
        <div class="mt-5">
            <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
        </div>
    </div>
</div>
{% endblock %}
